version: 2
updates:
  # pnpm workspace: Dependabot's YAML value for pnpm projects is `npm`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 05:00
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is blocked upstream, not here: tsup@9 imports the compiler
      # API (parseJsonConfigFileContent) for --dts and TS 7 no longer ships it.
      # tsup has no TS 7 support planned (egoist/tsup#1405). Revisit then.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"

  # Tauri desktop app (Rust side of the menubar app).
  - package-ecosystem: cargo
    directory: /apps/menubar-macos/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: 05:00
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 05:00
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
